# CI for macaw_auth: the hard gate that keeps main green. Every push and
# merge request runs the checks the work-item skills require locally, plus
# American spelling. Group runner tagged DCOTek, pinned hexpm image so a
# toolchain bump is a deliberate commit.

variables:
  ELIXIR_IMAGE: hexpm/elixir:1.20.4-erlang-29.0.5-debian-bookworm-20260824-slim

default:
  tags:
    - DCOTek
  interruptible: true

stages:
  - check
  - test

.elixir:
  image: $ELIXIR_IMAGE
  variables:
    MIX_ENV: test
  before_script:
    # Git dependencies (macaw_plug, macaw_host) come over HTTPS with this job's token:
    # the image has no git, and the SSH URLs in mix.exs need a key CI lacks.
    # macaw_plug and macaw_host allowlist this project's job token. build-essential: the
    # bcrypt and argon2 NIFs compile from source, and the slim image has no
    # C compiler.
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git ca-certificates build-essential > /dev/null
    - git config --global url."https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.conet.yarina.org/".insteadOf "git@gitlab.conet.yarina.org:"
    - mix local.hex --force
    - mix local.rebar --force
    # Compiled dependencies come from the group's depdep store (scripts/depdep.exs,
    # spec/00 §4.1 of macaw_compose); git dependencies' sources are restored too. A
    # store that can't be reached falls back to a bare deps.get.
    - elixir scripts/depdep.exs --pull --mix-get --compile-deps || mix deps.get

format:
  extends: .elixir
  stage: check
  script:
    - mix format --check-formatted

compile:
  extends: .elixir
  stage: check
  script:
    - mix compile --force --warnings-as-errors
    # Push what the store lacked, only after a green build.
    - elixir scripts/depdep.exs --push || echo "depdep bootstrap failed - nothing pushed"

spelling:
  image: $ELIXIR_IMAGE
  stage: check
  script:
    - elixir ci/spelling.exs

# Every spec link resolves (ci/spec_links.exs): links into another Macaw
# repository's spec are checked by shape here, where no sibling checkout exists.
spec-links:
  image: $ELIXIR_IMAGE
  stage: check
  script:
    - elixir ci/spec_links.exs

# No test waits on the clock (ci/no_sleep.exs): no `Process.sleep` or
# `:timer.sleep` in test/ or the conformance kit; an injected clock instead.
no-sleep:
  image: $ELIXIR_IMAGE
  stage: check
  script:
    - elixir ci/no_sleep.exs

test:
  extends: .elixir
  stage: test
  # The OpenLDAP fixture directory for the :ldap tests, Collpa's image (its
  # registry allowlists this project's job token): LDAP with StartTLS on
  # 389, LDAPS on 636, with the CA in test/fixtures/ldap.
  services:
    - name: gitlab.conet.yarina.org:5005/dco-tek/macaw/collpa/ci-ldap:309a2b786e6fa13b
      alias: ldap
  variables:
    MIX_ENV: test
    MACAW_AUTH_LDAP_HOST: ldap
  script:
    - mix test
    # Spec, tests and code aligned (macaw_compose spec/00 §4.1): the status reads this
    # job's test run as evidence, so it runs right after it, in the same job.
    - mix surfex.status

# The throttle's model (spec/10 §7): `mix auth.verify` runs `mix extla.check` on
# every model.
models:
  extends: .elixir
  stage: test
  script:
    - mix auth.verify
